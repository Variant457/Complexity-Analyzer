<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python Complexity Analyzer</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        textarea { width: 100%; height: 200px; }
        pre { background-color: #f4f4f4; padding: 1em; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Python Complexity Analyzer</h1>
    <form action="/" method="post">
        <label for="code">Enter your Python code below:</label>
        <textarea id="code" name="code">{% if code %}{{ code }}{% endif %}</textarea>
        <br>
        <input type="submit" value="Analyze">
    </form>

    {% if result %}
        <h2>Analysis Result</h2>
        <h3>Overall Complexity: {{ result.big_o }}</h3>
        <p><b>Explanation:</b> {{ result.explanation }}</p>
        
        <h4>Full JSON Response:</h4>
        <pre>{{ result_json }}</pre>
    {% endif %}

    {% if error %}
        <h2>Error</h2>
        <pre>{{ error }}</pre>
    {% endif %}
</body>
</html>
